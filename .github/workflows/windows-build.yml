name: Windows build

# Builds the Tauri desktop app for Windows (x64), including the agent-server
# sidecar and the ffmpeg sidecar that Tauri's externalBin config requires.
# Trigger manually via the Actions tab / `gh workflow run`, or on push to the
# listed branches.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'security/**'
      - 'ci/**'
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'agent-server/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo / Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install

      - name: Install agent-server dependencies
        working-directory: agent-server
        # `--trust` lets any native postinstall scripts actually run under Bun.
        run: bun install --trust

      - name: Embed prompts and stage native deps
        working-directory: agent-server
        # embed: prompts must be baked into the compiled sidecar (installed
        # bundles have no source tree). stage: bun can't embed libsql's native
        # addon, so it ships as a Tauri resource that lib.rs exposes via
        # NODE_PATH.
        run: |
          bun run embed
          node scripts/stage-native-deps.mjs

      - name: Ensure sidecar binaries directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null

      - name: Compile agent-server sidecar (Windows x64)
        working-directory: agent-server
        run: bun build --compile --target=bun-windows-x64 src/index.ts --outfile ../src-tauri/binaries/agent-server-x86_64-pc-windows-msvc.exe

      # ffmpeg is intentionally excluded from this build; tauri.windows.conf.json
      # overrides externalBin so the bundler doesn't require an ffmpeg sidecar.

      - name: Verify sidecar binary is present
        shell: pwsh
        run: Get-ChildItem src-tauri/binaries

      - name: Build Tauri app (NSIS installer)
        # tauri.windows.conf.json pins bundle targets to ["nsis"]; --bundles nsis
        # makes that explicit so a config drift can't silently pull in the WiX/MSI
        # toolchain on the runner.
        run: bun run tauri build --bundles nsis

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: sahamati-windows-nsis
          if-no-files-found: error
          path: src-tauri/target/release/bundle/nsis/*.exe
